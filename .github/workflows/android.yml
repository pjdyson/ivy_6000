name: Android build

# Mobile is a later step: this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
      - run: pip install buildozer "cython<3.1"
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build debug APK
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: IVY-6000-apk
          path: bin/*.apk
