name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest anthropic certifi
      # The tests cover the pure-Python modules (sprites, config, llm); no display needed.
      - run: pytest -q
