name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[claude]" pyinstaller
      - name: Build (Linux, needs a virtual display for Kivy)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a pyinstaller --noconfirm --name IVY-6000 --windowed main.py
      - name: Build
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm --name IVY-6000 --windowed main.py
      - uses: actions/upload-artifact@v4
        with:
          name: IVY-6000-${{ runner.os }}
          path: dist/
