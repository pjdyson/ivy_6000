[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivy-6000"
version = "0.1.0"
description = "A pixelated, deadpan floating-head front end for LLM chat (Claude, LM Studio, Ollama, OpenAI-compatible)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "kivy>=2.3,<2.4",
    "certifi",
    "pyttsx3>=2.90; sys_platform == 'win32'",  # speech on Windows (macOS/Linux use say/espeak)
]

[project.optional-dependencies]
claude = ["anthropic>=2.10"]
dev = ["pytest", "anthropic>=2.10", "pyinstaller"]

[project.scripts]
ivy-6000 = "ivy6000.app:run"

[tool.setuptools]
packages = ["ivy6000"]

[tool.pytest.ini_options]
testpaths = ["tests"]
